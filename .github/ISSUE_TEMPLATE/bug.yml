name: Bug
description: A rule renders wrongly, a test fails, or the checker reports something it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, the markup involved, and what you expected instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and version
    validations:
      required: true
