<!doctype html>
<html lang="en" data-skin="mms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen title</title>
    <link rel="stylesheet" href="mms-skin.css" />
  </head>
  <body>
    <header class="masthead">
      <h1 class="masthead-title">Screen title</h1>
      <span class="badge">Sample data</span>
      <span class="spacer"></span>
      <span class="masthead-user">Signed in as <b>user</b></span>
    </header>

    <main>
      <div class="tabstrip" role="tablist" aria-label="Screens">
        <button class="tab" type="button" role="tab" aria-selected="true"><span>First tab</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false"><span>Second tab</span></button>
      </div>
      <div class="tabstrip-rule"></div>

      <div class="content">
        <section class="section">
          <button class="section-header" type="button" aria-expanded="true" aria-controls="query-body">
            <span class="section-caret" aria-hidden="true">▼</span>Query
          </button>
          <div id="query-body">
            <div class="query">
              <span class="query-field">
                <label for="day">Operating Day</label>
                <input id="day" type="date" value="2030-03-08" />
              </span>
            </div>
            <div class="actions">
              <button class="btn primary" type="button">Submit</button>
              <button class="btn" type="button">Reset</button>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="grid-title">Results</div>
          <div class="grid-scroll">
            <table class="grid">
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col" class="num">MW</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr class="selectable" aria-selected="false">
                  <td>SAMPLE_1</td>
                  <td class="num">10.0</td>
                  <td><span class="pill ok">OK</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <footer class="statusbar">
      <span class="statusbar-code ok">OK</span>
      <span>Ready.</span>
      <span class="spacer"></span>
      <span class="statusbar-stamp">2030-03-08 09:00:00 CT</span>
    </footer>
  </body>
</html>
